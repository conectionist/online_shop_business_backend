services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: 1000
        GID: 1000
    container_name: online_shop_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Cookie-based auth configuration (see app/core/config.py)
      # COOKIE_SECURE controls the Secure flag on auth cookies.
      #   - In production you typically want this true so cookies are HTTPS-only.
      #   - In non-HTTPS local environments you may leave it unset/false.
      # COOKIE_SAMESITE controls SameSite policy for auth cookies: "lax" or "strict".
      # COOKIE_DOMAIN can be set to your API host (e.g. api.example.com); if unset, the host default is used.
      # COOKIE_PATH controls the cookie Path attribute (default "/").
      # COOKIE_SECURE=${COOKIE_SECURE}
      # COOKIE_SAMESITE=${COOKIE_SAMESITE}
      # COOKIE_DOMAIN=${COOKIE_DOMAIN}
      # COOKIE_PATH=${COOKIE_PATH}
      - FRONTEND_URL=${FRONTEND_URL}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - DB_NAME=${MYSQL_DATABASE}
      - UPLOAD_FOLDER=/app/uploads
      # Image upload: max file size in MB (default 15)
      - MAX_IMAGE_SIZE_MB=${MAX_IMAGE_SIZE_MB:-15}
      # Trusted Hosts for FastAPI TrustedHostMiddleware
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      # CORS Configuration
      # Set your production domains here or override in .env file
      - CORS_ORIGINS=${CORS_ORIGINS}
      # JWT Configuration
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      # Web Push (VAPID)
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      # Disable OpenAPI docs in production for security
      - ENABLE_OPENAPI_DOCS=true
      # Reverse proxy: which IPs may set X-Forwarded-* headers (default 127.0.0.1)
      - USE_PROXY_HEADERS=${USE_PROXY_HEADERS:-true}
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-127.0.0.1}
      # Order creation rate limit (per-IP): max orders per IP per window (see docs/ORDER_RATE_LIMIT.md)
      - ORDER_RATE_LIMIT_MAX=${ORDER_RATE_LIMIT_MAX:-10}
      - ORDER_RATE_LIMIT_WINDOW=${ORDER_RATE_LIMIT_WINDOW:-24hour}
      # Admin login brute-force protection (per-IP): max login attempts per IP per window
      - LOGIN_RATE_LIMIT_MAX=${LOGIN_RATE_LIMIT_MAX:-5}
      - LOGIN_RATE_LIMIT_WINDOW=${LOGIN_RATE_LIMIT_WINDOW:-5minute}
      - CORP_POLICY=${CORP_POLICY}
      # Redis cache
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_USERNAME=${REDIS_USERNAME:-default}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./config/placeholders:/app/config/placeholders
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend
      - frontend

  db:
    image: mysql:8.4
    container_name: online_shop_mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    # REMOVED: Database port should NOT be exposed in production
    # ports:
    #   - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql.cnf:/etc/mysql/conf.d/custom.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

  redis:
    image: redis:8-alpine
    container_name: online_shop_redis
    restart: unless-stopped
    environment:
      - REDIS_USERNAME=${REDIS_USERNAME:-default}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --user \"${REDIS_USERNAME:-default}\" -a \"${REDIS_PASSWORD}\" ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.50'
        reservations:
          memory: 64M
          cpus: '0.10'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true  # Backend network is internal only

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
  logs_data:
    driver: local
