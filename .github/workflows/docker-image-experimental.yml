name: Docker Image CI (experimental)

on:
  push:
    branches: [ "experimental" ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'README*'
      - 'LICENSE*'
      - '.github/*.md'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  run-api-tests-experimental:
    runs-on: ubuntu-latest

    services:
      docker:
        image: docker:dind
        options: --privileged

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker and Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Set up environment
        run: |
          mkdir -p test-reports
          chmod 777 test-reports

      - name: Run API Integration Tests
        run: |
          chmod +x ./run_api_integration_tests.sh
          ./run_api_integration_tests.sh

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports-experimental
          path: test-reports/

      - name: Login to GitHub Container Registry
        if: success()
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: success()
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=experimental
            type=sha,prefix={{branch}}-
            type=raw,value={{date 'YYYY-MM-DD-HH-mm'}}

      - name: Build and push Docker image (experimental)
        if: success()
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cleanup old experimental images (keep last 10)
        if: github.ref == 'refs/heads/experimental'
        run: |
          set -euo pipefail
          if ! VERSIONS_JSON=$(gh api repos/${{ github.repository }}/packages/container/${{ env.IMAGE_NAME }}/versions 2>/dev/null); then
            echo "No container package versions found (yet). Skipping cleanup."
            exit 0
          fi

          EXP_JSON=$(echo "$VERSIONS_JSON" | jq '[ .[] | select( (.metadata.container.tags // []) | any(.;
            test("^experimental$|
                 ^experimental-([a-f0-9]{7,40})$|
                 ^[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{2}-[0-9]{2}$")) ) ]')

          COUNT=$(echo "$EXP_JSON" | jq 'length')
          echo "Found $COUNT experimental image versions."

          if [ "$COUNT" -le 10 ]; then
            echo "Nothing to clean up."
            exit 0
          fi

          echo "$EXP_JSON" \
            | jq -r 'sort_by(.created_at) | reverse | .[10:] | .[].id' \
            | while read -r VID; do
                echo "Deleting old experimental image version id: $VID"
                gh api -X DELETE repos/${{ github.repository }}/packages/container/${{ env.IMAGE_NAME }}/versions/$VID || true
              done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}


