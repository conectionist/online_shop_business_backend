services:
  api_debug:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: online_shop_api_debug
    restart: unless-stopped
    ports:
      - "8002:8000"  # Different port to avoid conflicts with production (8000) and test (8001)
      - "5678:5678"  # debugpy port
    environment:
      - DEBUG=1
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - ENVIRONMENT=development
      # Cookie-based auth configuration for debug environment (see app/core/config.py)
      # These are typically left to defaults, but can be overridden while debugging cookie behavior:
      #   COOKIE_SECURE=false
      #   COOKIE_SAMESITE=lax
      #   COOKIE_DOMAIN=
      #   COOKIE_PATH=/
      # COOKIE_SECURE=${COOKIE_SECURE}
      # COOKIE_SAMESITE=${COOKIE_SAMESITE}
      # COOKIE_DOMAIN=${COOKIE_DOMAIN}
      # COOKIE_PATH=${COOKIE_PATH}
      - FRONTEND_URL=${FRONTEND_URL}
      - DB_HOST=db_debug
      - DB_PORT=3306
      - DB_USER=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - DB_NAME=${MYSQL_DATABASE}
      - UPLOAD_FOLDER=/app/uploads
      # Trusted Hosts for FastAPI TrustedHostMiddleware
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      # CORS Configuration
      # Set your production domains here or override in .env file
      - CORS_ORIGINS=${CORS_ORIGINS}
      # JWT Configuration
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      # Enable OpenAPI docs in development environment
      - ENABLE_OPENAPI_DOCS=true
    depends_on:
      db_debug:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./config/placeholders:/app/config/placeholders
      - ./app:/app/app  # Mount app directory for live code changes
      - logs_data_debug:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - debug_backend
      - debug_frontend

  db_debug:
    image: mysql:8.0
    container_name: online_shop_mysql_debug
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    ports:
      - "3307:3306"  # Different port to avoid conflicts with production (3306)
    volumes:
      - mysql_data_debug:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - debug_backend

networks:
  debug_frontend:
    driver: bridge
  debug_backend:

volumes:
  mysql_data_debug:
  logs_data_debug:
    driver: local
