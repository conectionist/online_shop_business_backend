[loggers]
keys=root,uvicorn,uvicorn_error,uvicorn_access

[handlers]
keys=console

[formatters]
keys=standard,access

[logger_root]
level=INFO
handlers=console

[logger_uvicorn]
level=INFO
handlers=console
qualname=uvicorn
propagate=0

[logger_uvicorn_error]
level=INFO
handlers=console
qualname=uvicorn.error
propagate=0

[logger_uvicorn_access]
level=INFO
handlers=console
qualname=uvicorn.access
propagate=0

[handler_console]
class=StreamHandler
level=DEBUG
formatter=standard
args=(sys.stdout,)

[formatter_standard]
format=%(asctime)s %(levelname)s:%(name)s:%(message)s
datefmt=%Y-%m-%d %H:%M:%S

[formatter_access]
format=%(asctime)s %(levelname)s:%(name)s:%(client_addr)s - "%(request_line)s" %(status_code)s
datefmt=%Y-%m-%d %H:%M:%S
