[loggers]
keys=root,uvicorn,uvicorn_error,uvicorn_access

[handlers]
keys=console,file,file_access

[formatters]
keys=standard,access

[logger_root]
level=INFO
handlers=console,file

[logger_uvicorn]
level=INFO
handlers=console,file
qualname=uvicorn
propagate=0

[logger_uvicorn_error]
level=INFO
handlers=console,file
qualname=uvicorn.error
propagate=0

[logger_uvicorn_access]
level=INFO
handlers=console,file_access
qualname=uvicorn.access
propagate=0

[handler_console]
class=StreamHandler
level=DEBUG
formatter=standard
args=(sys.stdout,)

[handler_file]
class=logging.handlers.RotatingFileHandler
level=DEBUG
formatter=standard
args=('/app/logs/app.log', 'a', 10485760, 5)
# args: filename, mode, maxBytes (10MB), backupCount (5 files)

[handler_file_access]
class=logging.handlers.RotatingFileHandler
level=INFO
formatter=access
args=('/app/logs/access.log', 'a', 10485760, 5)
# args: filename, mode, maxBytes (10MB), backupCount (5 files)

[formatter_standard]
format=%(asctime)s %(levelname)s:%(name)s:%(message)s
datefmt=%Y-%m-%d %H:%M:%S

[formatter_access]
format=%(asctime)s %(levelname)s:%(name)s:%(message)s
datefmt=%Y-%m-%d %H:%M:%S
