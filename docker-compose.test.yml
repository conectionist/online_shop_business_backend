services:
  # MySQL test database container
  mysql_test:
    image: mysql:8.0
    container_name: online_shop_mysql_test
    restart: "no"
    environment:
      - MYSQL_ROOT_PASSWORD=${TEST_MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${TEST_MYSQL_DATABASE}
      - MYSQL_USER=${TEST_MYSQL_USER}
      - MYSQL_PASSWORD=${TEST_MYSQL_PASSWORD}
    ports:
      - "${TEST_MYSQL_PORT}:3306"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./test/test_data/seed_data.sql:/docker-entrypoint-initdb.d/02-seed_data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
    networks:
      - test_network

  # API server test container
  api_server_test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: online_shop_api_test
    restart: "no"
    ports:
      - "8001:8000"  # Different port to avoid conflicts
    environment:
      - DB_HOST=mysql_test
      - DB_PORT=3306
      - DB_USER=${TEST_MYSQL_USER}
      - DB_PASSWORD=${TEST_MYSQL_PASSWORD}
      - DB_NAME=${TEST_MYSQL_DATABASE}
      - ENVIRONMENT=test
    depends_on:
      mysql_test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - test_network

  # Schemathesis container for API testing
  api_tests:
    image: schemathesis/schemathesis:stable
    depends_on:
      api_server_test:
        condition: service_healthy
    command: >
      run http://api_server_test:8000/openapi.json 
      --experimental=openapi-3.1 
      --junit-xml=/reports/report.xml 
      --hypothesis-max-examples=300
      --checks=all 
      --hypothesis-verbosity=normal 
      --max-failures=100
      --wait-for-schema=30
    environment:
      - SCHEMATHESIS_BASE_URL=http://api_server_test:8000
    volumes:
      - ./test_reports:/reports
    networks:
      - test_network

networks:
  test_network:
    driver: bridge

volumes:
  test_reports:
