global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: online_shop_api
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - api:8000
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/online_shop_metrics_token

