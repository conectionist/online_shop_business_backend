name: API Integration Tests

on:
  push:
    branches: [ master, develop ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'README*'
      - 'LICENSE*'
      - '.github/*.md'
  pull_request:
    branches: [ master, develop ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'README*'
      - 'LICENSE*'
      - '.github/*.md'

permissions:
  contents: read
  packages: write

jobs:
  run-api-tests:
    runs-on: ubuntu-latest
    
    services:
      docker:
        image: docker:dind
        options: --privileged

    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Docker and Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Set up environment
        run: |
          # Create the parent directory for test reports
          mkdir -p test-reports
          # The scripts will create subdirectories, so we just need to ensure the base is writable
          chmod 777 test-reports

      # - name: Run API Contract Tests
      #   run: |
      #     chmod +x ./run_api_contract_tests.sh
      #     ./run_api_contract_tests.sh

      - name: Run API Integration Tests
        run: |
          chmod +x ./run_api_integration_tests.sh
          ./run_api_integration_tests.sh

      - name: Upload test reports
        if: always()  # Upload reports even if tests fail
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: test-reports/

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
      # - name: Send notification on failure
      #   if: failure()
      #   uses: rtCamp/action-slack-notify@v2
