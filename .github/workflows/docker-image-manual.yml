name: Manual API Tests and Docker Build

on:
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  manual-build:
    runs-on: ubuntu-latest

    services:
      docker:
        image: docker:dind
        options: --privileged

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker and Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Create Builder Instance
        run: |
          docker buildx create --use --name mybuilder

      - name: Set up environment
        run: |
          # Create the parent directory for test reports
          mkdir -p test-reports
          # The scripts will create subdirectories, so we just need to ensure the base is writable
          chmod 777 test-reports

      # - name: Run API Contract Tests
      #   run: |
      #     chmod +x ./run_api_contract_tests.sh
      #     ./run_api_contract_tests.sh

      - name: Run API Integration Tests
        run: |
          chmod +x ./run_api_integration_tests.sh
          ./run_api_integration_tests.sh

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: test-reports/

      - name: Login to GitHub Container Registry
        if: success()
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: success()
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=manual
            type=raw,value={{date 'YYYY-MM-DD-HH-mm'}}
            type=sha,prefix=manual-

      - name: Build and push Docker image (manual)
        if: success()
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


