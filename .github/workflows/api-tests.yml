name: API Integration Tests

on:
  push:
    branches: [ master, develop ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'README*'
      - 'LICENSE*'
      - '.github/*.md'
  pull_request:
    branches: [ master, develop ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'README*'
      - 'LICENSE*'
      - '.github/*.md'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  run-api-tests:
    runs-on: ubuntu-latest
    
    services:
      docker:
        image: docker:dind
        options: --privileged

    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Docker and Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Set up environment
        run: |
          # Create the parent directory for test reports
          mkdir -p test-reports
          # The scripts will create subdirectories, so we just need to ensure the base is writable
          chmod 777 test-reports

      # - name: Run API Contract Tests
      #   run: |
      #     chmod +x ./run_api_contract_tests.sh
      #     ./run_api_contract_tests.sh

      - name: Run API Integration Tests
        run: |
          chmod +x ./run_api_integration_tests.sh
          ./run_api_integration_tests.sh

      - name: Upload test reports
        if: always()  # Upload reports even if tests fail
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: test-reports/

      - name: Login to GitHub Container Registry
        if: success()  # Only login if tests passed
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: success()  # Only extract metadata if tests passed
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYY-MM-DD-HH-mm'}},enable={{is_default_branch}}

      - name: Build and push Docker image
        if: success()  # Only build and push if tests passed
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cleanup old images
        if: success() && github.ref == 'refs/heads/master'  # Only cleanup on master branch
        run: |
          # Get all image tags for this repository
          TAGS=$(gh api repos/${{ github.repository }}/packages/container/${{ env.IMAGE_NAME }}/versions --jq '.[].metadata.container.tags[]' 2>/dev/null || echo "")
          
          if [ -n "$TAGS" ]; then
            # Filter out 'latest' and current commit, then sort by date and keep only 5 most recent
            KEEP_TAGS=$(echo "$TAGS" | grep -v "latest" | grep -v "${{ github.sha }}" | sort -r | head -5)
            
            # Delete older tags (this will delete the associated image versions)
            echo "$TAGS" | grep -v "latest" | grep -v "${{ github.sha }}" | sort -r | tail -n +6 | while read tag; do
              if [ -n "$tag" ]; then
                echo "Deleting old image version: $tag"
                gh api -X DELETE repos/${{ github.repository }}/packages/container/${{ env.IMAGE_NAME }}/versions/$(gh api repos/${{ github.repository }}/packages/container/${{ env.IMAGE_NAME }}/versions --jq ".[] | select(.metadata.container.tags[] | contains(\"$tag\")) | .id")
              fi
            done
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # - name: Send notification on failure
      #   if: failure()
      #   uses: rtCamp/action-slack-notify@v2
      #   env:
      #     SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      #     SLACK_CHANNEL: api-tests
      #     SLACK_COLOR: danger
      #     SLACK_MESSAGE: 'API Tests Failed :x:'
      #     SLACK_TITLE: 'Test Results'
